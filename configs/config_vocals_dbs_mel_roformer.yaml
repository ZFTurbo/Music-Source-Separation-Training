audio:
  chunk_size: 88200
  dim_f: 1024
  dim_t: 200
  hop_length: 441
  n_fft: 2048
  num_channels: 2
  sample_rate: 44100
  min_mean_abs: 0.001

model:
  dim: 256
  depth: 6
  stereo: true
  num_stems: 1
  num_bands: 128
  coarse_boundaries: [0, 64, 128, 576, 1025]
  max_shift_bins: 16.0
  router_hidden_dim: 128
  latent_dim: 32
  basis_order: 4
  temperature: 0.25
  decoder_depth: 2
  decoder_expansion: 4
  time_transformer_depth: 1
  freq_transformer_depth: 1
  dim_head: 64
  heads: 8
  attn_dropout: 0.1
  ff_dropout: 0.1
  stft_n_fft: 2048
  stft_hop_length: 512
  stft_win_length: 2048
  stft_normalized: false
  multi_stft_resolution_loss_weight: 1.0
  multi_stft_resolutions_window_sizes: !!python/tuple [4096, 2048, 1024, 512, 256]
  multi_stft_hop_size: 147
  add_value_residual: true

training:
  batch_size: 4
  gradient_accumulation_steps: 2
  grad_clip: 1.0
  instruments: [vocals, other]
  target_instrument: vocals
  lr: 5.0e-4
  patience: 10
  reduce_factor: 0.9
  num_epochs: 1000
  num_steps: 1000
  q: 0.95
  coarse_loss_clip: true
  optimizer: adamw
  other_fix: false
  use_amp: true

augmentations:
  enable: true
  loudness: true
  loudness_min: 0.5
  loudness_max: 1.5
  mixup: true
  mixup_probs: !!python/tuple [0.2, 0.02]
  mixup_loudness_min: 0.5
  mixup_loudness_max: 1.5

inference:
  batch_size: 1
  dim_t: 200
  num_overlap: 4
