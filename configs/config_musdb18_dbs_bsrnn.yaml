audio:
  chunk_size: 131584
  dim_f: 1024
  dim_t: 256
  hop_length: 512
  n_fft: 2048
  num_channels: 2
  sample_rate: 44100
  min_mean_abs: 0.001

model:
  dim: 128
  depth: 12
  num_stems: 4
  stereo: true
  sample_rate: 44100
  rnn_hidden_size: 256
  region_configs:
    - {start: 0, end: 64, target_ratio: 2, max_chunks: 32}
    - {start: 64, end: 128, target_ratio: 2, max_chunks: 32}
    - {start: 128, end: 576, target_ratio: 14, max_chunks: 32}
    - {start: 576, end: 1025, target_ratio: 14.03125, max_chunks: 32}
  use_mixture_context: true
  ratio_loss_weight: 0.01
  multi_stft_resolution_loss_weight: 1.0
  squeeze_mono_output: false
  activation_checkpointing: true

training:
  batch_size: 1
  gradient_accumulation_steps: 4
  grad_clip: 1.0
  instruments: [drums, bass, other, vocals]
  target_instrument: null
  lr: 1.0e-4
  patience: 10
  reduce_factor: 0.5
  num_epochs: 500
  num_steps: 1000
  q: 0.95
  coarse_loss_clip: true
  optimizer: adam
  other_fix: false
  use_amp: true

augmentations:
  enable: true
  loudness: true
  loudness_min: 0.5
  loudness_max: 1.5

inference:
  batch_size: 1
  dim_t: 256
  num_overlap: 4
