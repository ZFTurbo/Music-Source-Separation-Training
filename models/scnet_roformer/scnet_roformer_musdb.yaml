audio:
  chunk_size: 352800
  num_channels: 2
  sample_rate: 44100
  min_mean_abs: 0.000

model:
  sources: ['vocals', 'bass', 'drums', 'other']
  audio_channels: 2
  dims: [16, 32, 64, 128]
  nfft: 4096
  hop_size: 1024
  band_SR: [0.02, 0.2, 0.3, 0.01, 0.1, 0.37]
  band_stride: [1, 2, 4, 6, 6, 10]
  band_kernel: [3, 2, 4, 6, 6, 10]
  conv_depths: [3, 3, 3, 3, 3, 3]
  conv_expansion: 4
  conv_kernel: 3
  num_dplayer: 6
  heads: 8
  dim_head: 64
  ff_mult: 4
  use_torch_checkpoint: false
  multi_stft_resolution_loss_weight: 1.0
  multi_stft_resolutions_window_sizes: !!python/tuple
  - 4096
  - 2048
  - 1024
  - 512
  - 256
  multi_stft_hop_size: 147
  multi_stft_normalized: false
  multi_stft_n_fft: 2048

training:
  model_type: scnet_roformer
  batch_size: 2
  gradient_accumulation_steps: 1
  grad_clip: 0
  instruments: ['vocals', 'bass', 'drums', 'other']
  target_instrument: null
  num_epochs: 1000
  num_steps: 1000
  patience: 1000
  reduce_factor: 0.95
  q: 0.95
  coarse_loss_clip: true
  ema_momentum: 0.999
  optimizer: adamw
  lr: 1.0e-04
  other_fix: false
  use_amp: true

inference:
  batch_size: 2
  num_overlap: 2
